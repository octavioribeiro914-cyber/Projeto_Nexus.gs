<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="t">
  <title id="t">Comparação: na rede tradicional, se a torre cai, todos ficam sem sinal; no NEXUS, o SOS vai direto para uma antena LoRa ou um satélite até a central</title>
  <style>
    .t{font:700 15px system-ui,sans-serif;fill:#e6edf7}
    .s{font:500 12px system-ui,sans-serif;fill:#9aa8bd}
    .off{fill:#0b1730;stroke:#475569;stroke-width:2}
    .cut{stroke:#475569;stroke-width:2;stroke-dasharray:5 6}
    .lora{stroke:#22d3ee;stroke-width:2.5;stroke-dasharray:7 6;fill:none}
    .sat{stroke:#60a5fa;stroke-width:2.5;stroke-dasharray:3 6;fill:none}
  </style>
  <rect x="1" y="1" width="308" height="278" rx="16" fill="#0a1020" stroke="#1e3a5f"/>
  <rect x="331" y="1" width="308" height="278" rx="16" fill="#0a1020" stroke="#1e3a5f"/>

  <!-- Rede tradicional -->
  <text class="t" x="24" y="34">Rede tradicional</text>
  <text class="s" x="24" y="54">Tudo depende da torre de celular</text>
  <path d="M155 95l-18 80h36z" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
  <path d="M141 120l28 12M139 140l32 14" stroke="#f43f5e" stroke-width="2"/>
  <path d="M146 88l18 14M164 88l-18 14" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  <line class="cut" x1="155" y1="175" x2="60" y2="230"/>
  <line class="cut" x1="155" y1="175" x2="120" y2="245"/>
  <line class="cut" x1="155" y1="175" x2="195" y2="245"/>
  <line class="cut" x1="155" y1="175" x2="255" y2="225"/>
  <circle class="off" cx="60" cy="230" r="10"/>
  <circle class="off" cx="120" cy="245" r="10"/>
  <circle class="off" cx="195" cy="245" r="10"/>
  <circle class="off" cx="255" cy="225" r="10"/>

  <!-- NEXUS -->
  <text class="t" x="354" y="34">NEXUS</text>
  <text class="s" x="354" y="54">Direto: LoRa ou satélite até a central</text>
  <path class="lora" d="M382 222 Q430 200 470 182"/>
  <path class="lora" d="M486 182 Q540 200 588 222"/>
  <path class="sat" d="M382 214 Q420 120 476 96"/>
  <path class="sat" d="M496 96 Q560 120 592 214"/>
  <rect x="370" y="214" width="20" height="30" rx="5" fill="#1a0b12" stroke="#f43f5e" stroke-width="2"/>
  <circle cx="380" cy="226" r="5" fill="#f43f5e"/>
  <path d="M478 186l-12 52h24z" fill="none" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="478" cy="182" r="5" fill="#22d3ee"/>
  <rect x="470" y="86" width="16" height="16" rx="3" fill="#101d34" stroke="#a5f3fc" stroke-width="2"/>
  <rect x="452" y="90" width="14" height="8" fill="#0b1f3a" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="490" y="90" width="14" height="8" fill="#0b1f3a" stroke="#60a5fa" stroke-width="1.5"/>
  <rect x="580" y="214" width="34" height="30" rx="6" fill="#06323b" stroke="#22d3ee" stroke-width="2"/>
  <path d="M597 221v16M589 229h16" stroke="#e6f9ff" stroke-width="3" stroke-linecap="round"/>
  <text class="s" x="360" y="268">Dispositivo</text>
  <text class="s" x="448" y="258">Antena LoRa</text>
  <text class="s" x="560" y="268">Central</text>
</svg>
